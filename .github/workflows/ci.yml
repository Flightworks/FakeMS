name: CI

on:
  push:
    branches:
      - main
      - dev/mission-simulation-foundation
  pull_request:
    branches:
      - main
      - dev/mission-simulation-foundation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build
